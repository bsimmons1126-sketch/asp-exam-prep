<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111d35"><title>ASP Sprint | Study Coach</title><style>body{margin:0;background:#0e172b;color:#f4f7ff;font:16px system-ui,-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:18px 16px 60px}h1{font-size:29px}h2{font-size:22px}.muted{color:#afbdd4}.card{background:#192740;border:1px solid #344662;border-radius:17px;padding:18px;margin:14px 0}button{background:#f5b942;color:#111827;border:0;border-radius:12px;padding:14px 17px;font-weight:750;font-size:16px;margin:5px 5px 5px 0;cursor:pointer}button.alt{background:#304362;color:white}button.choice{display:block;text-align:left;width:100%;background:#263954;color:white;margin:10px 0;line-height:1.4}button.choice:disabled{opacity:.7}button:focus-visible{outline:3px solid white}small{color:#b7c7dd}.pill{display:inline-block;background:#2c3f5c;border-radius:20px;padding:6px 10px;margin:3px} .good{color:#8be6af}.bad{color:#ffb5a8}progress{width:100%;height:15px} .note{border-left:4px solid #f5b942;padding-left:12px;line-height:1.5}</style><main id="app"></main><script>
const DATA=[
["Risk Management","A hazard has a high severity but low likelihood. What should determine its priority?","Evaluate combined likelihood and consequence in a risk assessment",["Ignore it because it is unlikely","Evaluate combined likelihood and consequence in a risk assessment","Rank it only by the number of employees","Treat all hazards as equal"],"Risk assessment considers both severity and likelihood."],

["Risk Management","What is the expected annual loss for a hazard with a 0.1 annual probability and a $80,000 consequence?","$8,000",["$800","$8,000","$80,000","$800,000"],"Expected loss = probability × consequence = 0.1 × $80,000."],

const KEY="asp-sprint-v2";let state;try{state=JSON.parse(localStorage.getItem(KEY))||{history:[],misses:{}}}catch{state={history:[],misses:{}}}let mode="",pool=[],pos=0,answers=[],deadline=0;const app=document.getElementById("app"),topics=[...new Set(DATA.map(x=>x[0]))];function save(){localStorage.setItem(KEY,JSON.stringify(state))}function button(label,fn,alt=false){let b=document.createElement("button");b.textContent=label;b.className=alt?"alt":"";b.onclick=fn;return b}function el(tag,text,cls){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function header(title,sub){app.replaceChildren(el("h1",title),el("p",sub,"muted"))}function stats(){let s={};topics.forEach(t=>s[t]={ok:0,n:0});state.history.forEach(h=>h.answers.forEach(a=>{let t=DATA[a.i][0];s[t].n++;if(a.ok)s[t].ok++}));return s}function ranked(){let s=stats();return topics.slice().sort((a,b)=>{let x=s[a],y=s[b];return (x.n?x.ok/x.n:0)-(y.n?y.ok/y.n:0)||x.n-y.n})}function home(){header("ASP Sprint","Personal study coach • ASP exam: Thursday, October 15, 2026");let c=el("section",undefined,"card");c.append(el("h2",state.history.length?"Your study priorities":"Start with your diagnostic"),el("p",state.history.length?"Recommendations update from your completed quizzes.":"Take a mixed-topic diagnostic to find what needs attention first."));c.append(button("Start diagnostic",()=>start("Diagnostic",DATA.map((_,i)=>i))));app.append(c);let s=stats();let p=el("section",undefined,"card");p.append(el("h2","Your personalized study plan"));ranked().forEach((t,j)=>{let v=s[t],pct=v.n?Math.round(v.ok/v.n*100):null;let d=el("div");d.style.padding="9px 0";d.append(el("strong",(j+1)+". "+t+" — "+(pct===null?"Not assessed":pct+"% ("+v.n+" answers)")));d.append(el("div",pct===null?"Priority: get a baseline.":pct<70?"Priority: review concepts, then retest.":"Keep practicing to retain this topic.","muted"));d.append(button("Study this",()=>study(t),true));p.append(d)});app.append(p);let q=el("section",undefined,"card");q.append(el("h2","Practice & review"));q.append(button("Practice weakest topic",()=>study(ranked()[0])),button("Timed mixed mock exam",()=>start("Mock",DATA.map((_,i)=>i),30)),button("Review missed questions",reviewMisses,true),button("Formula lab",formulas,true));app.append(q);app.append(el("p","Original practice questions only. Not affiliated with BCSP. This is a short-review tool, not an official exam or a prediction of passing.","muted"))}function start(name,ids,mins){mode=name;pool=ids.slice().sort(()=>Math.random()-.5);pos=0;answers=[];deadline=mins?Date.now()+mins*60000:0;question()}function question(){if(pos>=pool.length||(deadline&&Date.now()>deadline)){finish();return}let i=pool[pos],q=DATA[i];header(mode+" • "+(pos+1)+" / "+pool.length,q[0]);let c=el("section",undefined,"card");c.append(el("h2",q[1]));let options=q[3].slice().sort(()=>Math.random()-.5);options.forEach(o=>{let b=button(o,()=>{let ok=o===q[2];answers.push({i,ok,choice:o});pos++;let feedback=el("div",undefined,"card");feedback.append(el("h2",ok?"Correct":"Review this answer",ok?"good":"bad"),el("p","Correct answer: "+q[2]),el("p",q[4]));app.replaceChildren(feedback,button("Next question",question));if(pos>=pool.length)app.append(button("Finish now",finish,true))});b.className="choice";c.append(b)});app.append(c);app.append(button("Exit without saving",home,true));if(deadline)app.append(el("small","Timed session: 30 minutes total. The timer is checked when you answer or advance."))}function finish(){state.history.push({mode,date:new Date().toISOString(),answers});answers.forEach(a=>{if(a.ok)delete state.misses[a.i];else state.misses[a.i]=true});save();header("Session complete","Your plan has been updated.");let ok=answers.filter(a=>a.ok).length;let c=el("section",undefined,"card");c.append(el("h2",ok+" / "+answers.length+" correct"),el("p",Math.round(100*ok/Math.max(1,answers.length))+"% accuracy"));app.append(c);app.append(button("View updated priorities",home),button("Review missed",reviewMisses,true))}function study(topic){header(topic,"Read the explanations, then practice this topic.");let ids=DATA.map((q,i)=>q[0]===topic?i:-1).filter(i=>i>=0);ids.forEach(i=>{let q=DATA[i],c=el("section",undefined,"card");c.append(el("h2",q[1]),el("p","Key concept: "+q[4],"note"));app.append(c)});app.append(button("Quiz me on "+topic,()=>start(topic,ids)),button("Dashboard",home,true))}function reviewMisses(){header("Missed-question review","Use these explanations, then retry.");let ids=Object.keys(state.misses).map(Number);if(!ids.length)app.append(el("p","No missed questions saved yet. Complete a diagnostic first."));ids.forEach(i=>{let q=DATA[i],c=el("section",undefined,"card");c.append(el("h2",q[1]),el("p","Answer: "+q[2]),el("p",q[4],"note"));app.append(c)});if(ids.length)app.append(button("Retest missed questions",()=>start("Missed question retest",ids)));app.append(button("Dashboard",home,true))}function formulas(){header("Safety Formula Lab","Memorize the method and practice calculating.");[["Time-weighted average","TWA = Σ(concentration × duration) / total duration","Example: (100 ppm × 2h + 20 ppm × 6h) / 8h = 40 ppm."],["Incident rate","Cases × 200,000 / total hours worked","Example: 4 cases × 200,000 / 400,000 hours = 2.0."],["Expected loss","Probability × consequence","Example: 0.1 × $80,000 = $8,000."],["Percent","Part / whole × 100","Example: 15 / 60 × 100 = 25%."]].forEach(a=>{let c=el("section",undefined,"card");c.append(el("h2",a[0]),el("p",a[1]),el("p",a[2],"note"));app.append(c)});app.append(button("Practice math",()=>study("Math & Metrics")),button("Dashboard",home,true))}home();
</script></html>
