<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1930"><title>CSP Master | Learning Academy</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1930;color:#f3f6ff;font:16px system-ui,-apple-system,sans-serif;line-height:1.55}main{max-width:780px;margin:auto;padding:18px 16px 65px}h1{font-size:clamp(30px,6vw,45px);line-height:1.13}h2{font-size:23px;margin:0 0 12px}h3{margin:8px 0}p{margin:10px 0}.muted{color:#aebfda}.card{background:#192b47;border:1px solid #354e73;border-radius:18px;padding:20px;margin:14px 0}button,.btn{background:#ffc453;color:#17233a;border:0;border-radius:12px;padding:13px 17px;font-size:16px;font-weight:750;margin:5px 5px 5px 0;cursor:pointer}button.alt,.btn.alt{background:#304765;color:#fff}button:focus-visible,summary:focus-visible{outline:3px solid #fff}.choice{display:block;width:100%;text-align:left;background:#2b405f;color:#fff}.pill{display:inline-block;background:#2c405e;border-radius:20px;padding:5px 10px;margin:3px}.good{color:#92ebba}.bad{color:#ffb5ab}summary{cursor:pointer;font-size:18px;font-weight:700;padding:12px 2px}details{border-top:1px solid #354e73;padding:5px 0}.note{border-left:4px solid #ffc453;padding-left:13px}.top{display:flex;gap:8px;flex-wrap:wrap}progress{width:100%;height:15px}a{color:#ffd078}input,select{font:inherit}footer{color:#aebfda;font-size:13px;padding:16px 0} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.grid .card{margin:0} </style></head><body><main id="app"></main><script>const DB={"domains":[["Risk Management","Risk matrices, residual risk, hierarchy of controls, FMEA, fault trees","Identify hazards, estimate severity and likelihood, select controls and reassess residual risk.","Risk = likelihood × severity is a ranking aid, not a universal quantitative probability. Prefer elimination and substitution before engineering, administrative controls and PPE.","A task has high severity but low frequency. Do not dismiss it: consider credible worst-case outcomes and the strength of existing controls.","Search: risk assessment; FMEA; hierarchy of controls."],["Safety Management Systems","Leading indicators, audits, management of change, leadership","A system connects policy, planning, implementation, measurement and improvement.","Leading indicators measure preventive activity; lagging indicators measure outcomes. A strong system uses both.","After a process change, review new hazards before restart, assign owners, train affected personnel and verify controls.","Search: ISO 45001; management of change; leading indicators."],["Industrial Hygiene","Exposure assessment, sampling, TWA, ventilation, toxicology","Recognize routes of exposure and evaluate representative personal sampling.","8-hour TWA = Σ(C × time)/8 hours. Compare like units and check whether an exposure limit is a TWA, ceiling or short-term limit.","An operator works 2 h at 80 ppm and 6 h at 20 ppm: TWA = (160+120)/8 = 35 ppm.","Search: industrial hygiene; exposure limits; ventilation."],["Engineering & Technical Safety","Machine guarding, electricity, pressure, mechanics, reliability","Engineering controls separate people from hazards without relying solely on behavior.","Ohm's law: V=IR. Mechanical energy and stored pressure require isolation before servicing.","For 240 V across 60 Ω, I=240/60=4 A. Verify assumptions and units.","Search: electrical safety; lockout tagout; mechanics."],["Fire & Emergency","Fire dynamics, suppression, evacuation, incident command","Choose prevention and response measures matched to hazards.","Fire needs fuel, heat, oxidizer and a sustaining chain reaction; interrupting one element can stop combustion.","For a flammable-liquid spill, control ignition sources, isolate area and follow the site emergency plan; do not improvise an unsafe response.","Search: fire protection; emergency response; incident command."],["Environmental Management","Waste, spills, air/water impacts, compliance","Assess environmental aspects and manage releases using applicable requirements.","The waste generator must characterize waste and ensure proper handling; classification and thresholds depend on jurisdiction.","When an unknown drum leaks, isolate, identify contents safely, activate spill procedures and document required notifications.","Search: hazardous waste; spill response; environmental compliance."],["Ergonomics & Human Factors","Manual handling, task design, fatigue, error traps","Reduce force, repetition, awkward posture and duration through work design.","RULA screens upper-limb postural exposure; no single ergonomic tool replaces a task assessment.","Redesign a repetitive lift using lift assists and workstation height changes before relying only on lifting instruction.","Search: ergonomics; human factors; manual material handling."],["Training & Communication","Needs assessment, adult learning, competency, feedback","Training effectiveness is demonstrated by performance, not attendance alone.","Evaluate whether workers can perform the task safely; refresh after meaningful changes or demonstrated gaps.","If a worker passes a quiz but repeatedly bypasses a guard, investigate incentives, design and supervision—not only knowledge.","Search: safety training; adult learning; communication."],["Legal & Professional Practice","Regulatory frameworks, ethics, documentation, due diligence","Know how to find authoritative requirements and act within professional competence.","Legal requirements vary by location and industry; verify current applicable rules rather than relying on memorized numbers.","When asked to approve an unfamiliar technical design, document limitations and involve qualified specialists.","Search: OSHA; professional ethics; due diligence."],["Math & Data Analysis","Rates, probability, statistics, units, financial analysis","Write units first, calculate step by step and test whether results are reasonable.","OSHA-style incident rate = cases × 200,000 / hours worked. TWA = Σ(Ct)/Σt. Mean = sum/n.","4 cases in 400,000 hours gives rate 2.0. For 3 h at 40 ppm and 5 h at 16 ppm, TWA=25 ppm.","Search: math review; statistics; engineering economics."]],"questions":[{"id":"c0","d":0,"q":"A high-severity hazard has a low estimated probability. What is the best next step?","options":["Ignore it because likelihood is low","Evaluate credible consequences and control reliability","Replace the assessment with injury history","Issue PPE and close the finding"],"a":1,"why":"Low likelihood does not eliminate catastrophic consequence; assess uncertainty and barriers."},{"id":"c1","d":0,"q":"Which action is highest in the hierarchy of controls?","options":["Provide respirators","Post warning signs","Eliminate the hazardous task","Conduct refresher training"],"a":2,"why":"Elimination removes the exposure source."},{"id":"c2","d":0,"q":"After an engineering control is installed, what should be evaluated?","options":["Residual risk and actual control performance","Only purchase cost","Whether warning signs remain","Whether workers prefer PPE"],"a":0,"why":"Controls require verification and residual-risk assessment."},{"id":"c3","d":1,"q":"Which is a leading safety indicator?","options":["Lost-time injuries last year","Recordable case rate","Percentage of critical controls verified on schedule","Workers compensation cost"],"a":2,"why":"Preventive control verification measures activity before harm occurs."},{"id":"c4","d":1,"q":"A plant changes a chemical feedstock. What process should precede startup?","options":["Management of change review","Annual performance appraisal","Routine purchasing approval only","Post-incident investigation"],"a":0,"why":"Changes can introduce new hazards and need structured review."},{"id":"c5","d":1,"q":"An audit finds the same problem every quarter. What is the strongest corrective approach?","options":["Repeat the same reminder","Investigate system causes and verify action effectiveness","Remove the finding from the checklist","Wait for an injury"],"a":1,"why":"Recurring findings suggest systemic weaknesses."},{"id":"c6","d":2,"q":"A worker has exposures of 60 ppm for 2 hours and 20 ppm for 6 hours. What is the 8-hour TWA?","options":["20 ppm","25 ppm","30 ppm","40 ppm"],"a":2,"why":"(60×2 + 20×6)/8 = 30 ppm."},{"id":"c7","d":2,"q":"Which sampling strategy best estimates an individual worker's inhalation exposure?","options":["A distant outdoor monitor","Personal breathing-zone sampling representative of the task","Only a supply-air measurement","A single office-area sample"],"a":1,"why":"Personal breathing-zone samples better represent worker exposure."},{"id":"c8","d":2,"q":"Which limit describes an exposure that should not be exceeded at any time under its defined method?","options":["Ceiling limit","8-hour TWA","Annual mean","Median"],"a":0,"why":"A ceiling limit differs from a time-weighted average."},{"id":"c9","d":3,"q":"Before maintenance on a pressurized machine, what is essential?","options":["Tell employees to be careful","Isolate energy and verify zero-energy state","Rely on an emergency stop","Wear gloves only"],"a":1,"why":"Hazardous energy requires isolation, dissipation and verification."},{"id":"c10","d":3,"q":"A circuit has 120 V across 30 ohms. What is the current?","options":["0.25 A","4 A","30 A","3600 A"],"a":1,"why":"I=V/R=120/30=4 A."},{"id":"c11","d":3,"q":"Which is the strongest machine-guarding design?","options":["A fixed guard that prevents access to the danger zone","A poster reminding operators","A verbal warning at shift start","Safety glasses only"],"a":0,"why":"Fixed guarding physically prevents access."},{"id":"c12","d":4,"q":"Which combination is required for a sustained fire?","options":["Fuel, heat, oxidizer and chain reaction","Only fuel and water","Smoke and wind","Heat and humidity"],"a":0,"why":"The fire tetrahedron identifies the necessary elements."},{"id":"c13","d":4,"q":"What should an emergency drill primarily test?","options":["How fast everyone can run","Whether the response plan, roles and communications work","Only employee attendance","Whether the alarms are loud"],"a":1,"why":"Drills validate operational readiness and identify gaps."},{"id":"c14","d":4,"q":"A flammable liquid spill occurs near energized equipment. What is the first priority?","options":["Start cleanup without assessment","Protect people, isolate area and control ignition sources safely","Wash spill into a drain","Use any nearby extinguisher"],"a":1,"why":"Life safety and hazard isolation come before cleanup."},{"id":"c15","d":5,"q":"An unlabeled leaking drum is found. What should happen first?","options":["Mix it with other waste","Isolate the area and identify the material using safe procedures","Pour it into a storm drain","Assume it is nonhazardous"],"a":1,"why":"Unknown chemicals require controlled identification and response."},{"id":"c16","d":5,"q":"Which approach best reduces waste at the source?","options":["Increase disposal frequency","Substitute a less hazardous input and improve process yield","Store more waste indefinitely","Dilute waste before release"],"a":1,"why":"Source reduction avoids generating waste."},{"id":"c17","d":5,"q":"Who must ensure waste is properly characterized before management and disposal?","options":["The generator, using applicable rules","Only the truck driver","Only the property owner","Nobody if containers are sealed"],"a":0,"why":"Waste generators have characterization responsibilities."},{"id":"c18","d":6,"q":"What does RULA primarily screen?","options":["Upper-limb postural risk","Fire load","Noise dose","Groundwater contamination"],"a":0,"why":"RULA is an upper-limb ergonomic screening tool."},{"id":"c19","d":6,"q":"A job involves frequent awkward lifts. What is the preferred first redesign?","options":["Mechanical assistance and better workstation geometry","More warning signs","Only back belts","A poster on lifting"],"a":0,"why":"Engineering redesign reduces exposure more reliably."},{"id":"c20","d":6,"q":"Which factor is most relevant to cumulative musculoskeletal strain?","options":["Force, repetition, posture and duration","Office paint color","Job title alone","Building age"],"a":0,"why":"Combined exposure factors influence risk."},{"id":"c21","d":7,"q":"How should a supervisor confirm training was effective?","options":["Collect signatures only","Observe demonstrated safe performance","Count presentation slides","Assume attendance equals competence"],"a":1,"why":"Competence requires evidence of application."},{"id":"c22","d":7,"q":"A worker knows the procedure but repeatedly bypasses a guard. What should be examined?","options":["Only the worker's memory","Task design, incentives, supervision and control usability","Only annual training hours","Nothing until an incident"],"a":1,"why":"Behavior can reflect system pressures and poor design."},{"id":"c23","d":7,"q":"What is the best way to train an unfamiliar complex task?","options":["One long lecture without practice","Demonstration, supervised practice and feedback","A policy email only","A single multiple-choice question"],"a":1,"why":"Applied practice and feedback support transfer."},{"id":"c24","d":8,"q":"An employer operates in multiple jurisdictions. How should requirements be determined?","options":["Use the least strict rule","Identify and verify requirements applicable to each operation","Assume all rules are identical","Follow social media advice"],"a":1,"why":"Requirements vary by location, activity and authority."},{"id":"c25","d":8,"q":"A safety professional is asked to sign off on a design beyond their competence. What is appropriate?","options":["Approve to avoid delays","State limitations and involve qualified expertise","Guess based on experience","Ignore documentation"],"a":1,"why":"Ethical practice requires working within competence."},{"id":"c26","d":8,"q":"What is a defensible approach to documenting risk decisions?","options":["Keep no records","Record assumptions, evidence, approvals and follow-up","Only save the final score","Delete superseded findings"],"a":1,"why":"Traceable decisions support accountability and learning."},{"id":"c27","d":9,"q":"Four recordable cases occur in 400,000 hours worked. What is the incident rate using 200,000 hours?","options":["0.5","2.0","4.0","8.0"],"a":1,"why":"4×200,000/400,000=2.0."},{"id":"c28","d":9,"q":"What is the arithmetic mean of 4, 6, 8 and 10?","options":["6","7","8","28"],"a":1,"why":"(4+6+8+10)/4=7."},{"id":"c29","d":9,"q":"Which calculation correctly converts 2.5 hours to minutes?","options":["2.5×60=150","2.5/60=0.0417","2.5×100=250","2.5+60=62.5"],"a":0,"why":"Hours to minutes multiply by 60."},{"id":"rate0","d":9,"q":"Calculation 1: A site records 1 recordable cases during 100,000 hours worked. What is its OSHA-style incident rate?","options":["2.00","4.00","1.00","4.00"],"a":0,"why":"1 × 200,000 ÷ 100,000 = 2.00."},{"id":"rate1","d":9,"q":"Calculation 2: A site records 2 recordable cases during 150,000 hours worked. What is its OSHA-style incident rate?","options":["2.67","5.34","1.33","4.67"],"a":0,"why":"2 × 200,000 ÷ 150,000 = 2.67."},{"id":"rate2","d":9,"q":"Calculation 3: A site records 3 recordable cases during 200,000 hours worked. What is its OSHA-style incident rate?","options":["3.00","6.00","1.50","5.00"],"a":0,"why":"3 × 200,000 ÷ 200,000 = 3.00."},{"id":"rate3","d":9,"q":"Calculation 4: A site records 4 recordable cases during 250,000 hours worked. What is its OSHA-style incident rate?","options":["3.20","6.40","1.60","5.20"],"a":0,"why":"4 × 200,000 ÷ 250,000 = 3.20."},{"id":"rate4","d":9,"q":"Calculation 5: A site records 5 recordable cases during 300,000 hours worked. What is its OSHA-style incident rate?","options":["3.33","6.66","1.67","5.33"],"a":0,"why":"5 × 200,000 ÷ 300,000 = 3.33."},{"id":"rate5","d":9,"q":"Calculation 6: A site reco "2.50","5.00","1.25","4.50"],"a":0,"why":"5 × 200,000 ÷ 400,000 = 2.50."},{"id":"rate23","d":9,"q":"Calculation 24: A site records 6 recordable cases during 450,000 hours worked. What is its OSHA-style incident rate?","options":["2.67","5.34","1.33","4.67"],"a":0,"why":"6 × 200,000 ÷ 450,000 = 2.67."},{"id":"rate24","d":9,"q":"Calculation 25: A site records 7 recordable cases during 100,000 hours worked. What is its OSHA-style incident rate?","options":["14.00","28.00","7.00","16.00"],"a":0,"why":"7 × 200,000 ÷ 100,000 = 14.00."},{"id":"rate25","d":9,"q":"Calculation 26: A site records 8 recordable cases during 150,000 hours worked. What is its OSHA-style incident rate?","options":["10.67","21.34","5.33","12.67"],"a":0,"why":"8 × 200,000 ÷ 150,000 = 10.67."},{"id":"rate26","d":9,"q":"Calculation 27: A site records 9 recordable cases during 200,000 hours worked. What is its OSHA-style incident rate?","options":["9.00","18.00","4.50","11.00"],"a":0,"why":"9 × 200,000 ÷ 200,000 = 9.00."},{"id":"rate27","d":9,"q":"Calculation 28: A site records 1 recordable cases during 250,000 hours worked. What is its OSHA-style incident rate?","options":["0.80","1.60","0.40","2.80"],"a":0,"why":"1 × 200,000 ÷ 250,000 = 0.80."},{"id":"rate28","d":9,"q":"Calculation 29: A site records 2 recordable cases during 300,000 hours worked. What is its OSHA-style incident rate?","options":["1.33","2.66","0.67","3.33"],"a":0,"why":"2 × 200,000 ÷ 300,000 = 1.33."},{"id":"rate29","d":9,"q":"Calculation 30: A site records 3 recordable cases during 350,000 hours worked. What is its OSHA-style incident rate?","options":["1.71","3.42","0.85","3.71"],"a":0,"why":"3 × 200,000 ÷ 350,000 = 1.71."},{"id":"rate30","d":9,"q":"Calculation 31: A site records 4 recordable cases during 400,000 hours worked. What is its OSHA-style incident rate?","options":["2.00","4.00","1.00","4.00"],"a":0,"why":"4 × 200,000 ÷ 400,000 = 2.00."},{"id":"rate31","d":9,"q":"Calculation 32: A site records 5 recordable cases during 4  verified on schedule","Workers compensation cost"],"a":2,"why":"Preventive control verification measures activity before harm occurs."},{"id":"review34","d":1,"q":"Applied review 35: A plant changes a chemical feedstock. What process should precede startup?","options":["Management of change review","Annual performance appraisal","Routine purchasing approval only","Post-incident investigation"],"a":0,"why":"Changes can introduce new hazards and need structured review."},{"id":"review35","d":1,"q":"Applied review 36: An audit finds the same problem every quarter. What is the strongest corrective approach?","options":["Repeat the same reminder","Investigate system causes and verify action effectiveness","Remove the finding from the checklist","Wait for an injury"],"a":1,"why":"Recurring findings suggest systemic weaknesses."},{"id":"review36","d":2,"q":"Applied review 37: A worker has exposures of 60 ppm for 2 hours and 20 ppm for 6 hours. What is the 8-hour TWA?","options":["20 ppm","25 ppm","30 ppm","40 ppm"],"a":2,"why":"(60×2 + 20×6)/8 = 30 ppm."},{"id":"review37","d":2,"q":"Applied review 38: Which sampling strategy best estimates an individual worker's inhalation exposure?","options":["A distant outdoor monitor","Personal breathing-zone sampling representative of the task","Only a supply-air measurement","A single office-area sample"],"a":1,"why":"Personal breathing-zone samples better represent worker exposure."},{"id":"review38","d":2,"q":"Applied review 39: Which limit describes an exposure that should not be exceeded at any time under its defined method?","options":["Ceiling limit","8-hour TWA","Annual mean","Median"],"a":0,"why":"A ceiling limit differs from a time-weighted average."},{"id":"review39","d":3,"q":"Applied review 40: Before maintenance on a pressurized machine, what is essential?","options":["Tell employees to be careful","Isolate energy and verify zero-energy state","Rely on an emergency stop","Wear gloves only"],"a":1,"why":"Hazardous energy requires isolation, dissipation and verification."},{"id":"review40","d":3,"q":"Applied review 41: A circuit has 120 V across 30 ohms. What is the current?","options":["0.25 A","4 A","30 A","3600 A"],"a":1,"why":"I=V/R=120/30=4 A."},{"id":"review41","d":3,"q":"Applied review 42: Which is the strongest machine-guarding design?","options":["A fixed guard that prevents access to the danger zone","A poster reminding operators","A verbal warning at shift start","Safety glasses only"],"a":0,"why":"Fixed guarding physically prevents access."},{"id":"review42","d":4,"q":"Applied review 43: Which combination is required for a sustained fire?","options":["Fuel, heat, oxidizer and chain reaction","Only fuel and water","Smoke and wind","Heat and humidity"],"a":0,"why":"The fire tetrahedron identifies the necessary elements."},{"id":"review43","d":4,"q":"Applied review 44: What should an emergency drill primarily test?","options":["How fast everyone can run","Whether the response plan, roles and communications work","Only employee attendance","Whether the alarms are loud"],"a":1,"why":"Drills validate operational readiness and identify gaps."},{"id":"review44","d":4,"q":"Applied review 45: A flammable liquid spill occurs near energized equipment. What is the first priority?","options":["Start cleanup without assessment","Protect people, isolate area and control ignition sources safely","Wash spill into a drain","Use any nearby extinguisher"],"a":1,"why":"Life safety and hazard isolation come before cleanup."},{"id":"review45","d":5,"q":"Applied review 46: An unlabeled leaking drum is found. What should happen first?","options":["Mix it with other waste","Isolate the area and identify the material using safe procedures","Pour it into a storm drain","Assume it is nonhazardous"],"a":1,"why":"Unknown chemicals require controlled identification and response."},{"id":"review46","d":5,"q":"Applied review 47: Which approach best reduces waste at the source?","options":["Increase disposal frequency","Substitute a less hazardous input and improve process yield","Store more waste indefinitely","Dilute waste before release"],"a":1,"why":"Source reduction avoids generating waste."},{"id":"review47","d":5,"q":"Applied review 48: Who must ensure waste is properly characterized before management and disposal?","options":["The generator, using applicable rules","Only the truck driver","Only the property owner","Nobody if containers are sealed"],"a":0,"why":"Waste generators have characterization responsibilities."},{"id":"review48","d":6,"q":"Applied review 49: What does RULA primarily screen?","options":["Upper-limb postural risk","Fire load","Noise dose","Groundwater contamination"],"a":0,"why":"RULA is an upper-limb ergonomic screening tool."},{"id":"review49","d":6,"q":"Applied review 50: A job involves frequent awkward lifts. What is the preferred first redesign?","options":["Mechanical assistance and better workstation geometry","More warning signs","Only back belts","A poster on lifting"],"a":0,"why":"Engineering redesign reduces exposure more reliably."}],"cards":[{"id":"f0","d":0,"front":"A high-severity hazard has a low estimated probability. What is the best next step?","back":"Evaluate credible consequences and control reliability. Low likelihood does not eliminate catastrophic consequence; assess uncertainty and barriers."},{"id":"f1","d":0,"front":"Which action is highest in the hierarchy of controls?","back":"Eliminate the hazardous task. Elimination removes the exposure source."},{"id":"f2","d":0,"front":"After an engineering control is installed, what should be evaluated?","back":"Residual risk and actual control performance. Controls require verification and residual-risk assessment."},{"id":"f3","d":1,"front":"Which is a leading safety indicator?","back":"Percentage of critical controls verified on schedule. Preventive control verification measures activity before harm occurs."},{"id":"f4","d":1,"front":"A plant changes a chemical feedstock. What process should precede startup?","back":"Management of change review. Changes can introduce new hazards and need structured review."},{"id":"f5","d":1,"front":"An audit finds the same problem every quarter. What is the strongest corrective approach?","back":"Investigate system causes and verify action effectiveness. Recurring findings suggest systemic weaknesses."},{"id":"f6","d":2,"front":"A worker has exposures of 60 ppm for 2 hours and 20 ppm for 6 hours. What is the 8-hour TWA?","back":"30 ppm. (60×2 + 20×6)/8 = 30 ppm."},{"id":"f7","d":2,"front":"Which sampling strategy best estimates an individual worker's inhalation exposure?","back":"Personal breathing-zone sampling representative of the task. Personal breathing-zone samples better represent worker exposure."},{"id":"f8","d":2,"front":"Which limit describes an exposure that should not be exceeded at any time under its defined method?","back":"Ceiling limit. A ceiling limit differs from a time-weighted average."},{"id":"f9","d":3,"front":"Before maintenance on a pressurized machine, what is essential?","back":"Isolate energy and verify zero-energy state. Hazardous energy requires isolation, dissipation and verification."},{"id":"f10","d":3,"front":"A circuit has 120 V across 30 ohms. What is the current?","back":"4 A. I=V/R=120/30=4 A."},{"id":"f11","d":3,"front":"Which is the strongest machine-guarding design?","back":"A fixed guard that prevents access to the danger zone. Fixed guarding physically prevents access."},{"id":"f12","d":4,"front":"Which combination is required for a sustained fire?","back":"Fuel, heat, oxidizer and chain reaction. The fire tetrahedron identifies the necessary elements."},{"id":"f13","d":4,"front":"What should an emergency drill primarily test?","back":"Whether the response plan, roles and communications work. Drills validate operational readiness and identify gaps."},{"id":"f14","d":4,"front":"A flammable liquid spill occurs near energized equipment. What is the first priority?","back":"Protect people, isolate area and control ignition sources safely. Life safety and hazard isolation come before cleanup."},{"id":"f15","d":5,"front":"An unlabeled leaking drum is found. What should happen first?","back":"Isolate the area and identify the material using safe procedures. Unknown chemicals require controlled identification and response."},{"id":"f16","d":5,"front":"Which approach best reduces waste at the source?","back":"Substitute a less hazardous input and improve process yield. Source reduction avoids generating waste."},{"id":"f17","d":5,"front":"Who must ensure waste is properly characterized before management and disposal?","back":"The generator, using applicable rules. Waste generators have characterization responsibilities."},{"id":"f18","d":6,"front":"What does RULA primarily screen?","back":"Upper-limb postural risk. RULA is an upper-limb ergonomic screening tool."},{"id":"f19","d":6,"front":"A job involves frequent awkward lifts. What is the preferred first redesign?","back":"Mechanical assistance and better workstation geometry. Engineering redesign reduces exposure more reliably."},{"id":"f20","d":6,"front":"Which factor is most relevant to cumulative musculoskeletal strain?","back":"Force, repetition, posture and duration. Combined exposure factors influence risk."},{"id":"f21","d":7,"front":"How should a supervisor confirm training was effective?","back":"Observe demonstrated safe performance. Competence requires evidence of application."},{"id":"f22","d":7,"front":"A worker knows the procedure but repeatedly bypasses a guard. What should be examined?","back":"Task design, incentives, supervision and control usability. Behavior can reflect system pressures and poor design."},{"id":"f23","d":7,"front":"What is the best way to train an unfamiliar complex task?","back":"Demonstration, supervised practice and feedback. Applied practice and feedback support transfer."},{"id":"f24","d":8,"front":"An employer operates in multiple jurisdictions. How should requirements be determined?","back":"Identify and verify requirements applicable to each operation. Requirements vary by location, activity and authority."},{"id":"f25","d":8,"front":"A safety professional is asked to sign off on a design beyond their competence. What is appropriate?","back":"State limitations and involve qualified expertise. Ethical practice requires working within competence."},{"id":"f26","d":8,"front":"What is a defensible approach to documenting risk decisions?","back":"Record assumptions, evidence, approvals and follow-up. Traceable decisions support accountability and learning."},{"id":"f27","d":9,"front":"Four recordable cases occur in 400,000 hours worked. What is the incident rate using 200,000 hours?","back":"2.0. 4×200,000/400,000=2.0."},{"id":"f28","d":9,"front":"What is the arithmetic mean of 4, 6, 8 and 10?","back":"7. (4+6+8+10)/4=7."},{"id":"f29","d":9,"front":"Which calculation correctly converts 2.5 hours to minutes?","back":"2.5×60=150. Hours to minutes multiply by 60."}]};const KEY="csp-master-v1";let state;try{state=JSON.parse(localStorage.getItem(KEY))||{history:[],misses:{},cards:{},completed:{},sessions:[]}}catch{state={history:[],misses:{},cards:{},completed:{},sessions:[]}};const app=document.getElementById("app");let quiz=null;function save(){localStorage.setItem(KEY,JSON.stringify(state))}function el(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}function btn(txt,fn,alt=false){const b=el("button",txt,alt?"alt":"");b.onclick=fn;return b}function box(title){const s=el("section",undefined,"card");s.append(el("h2",title));app.append(s);return s}function reset(title,sub){app.innerHTML="";app.append(el("h1",title));if(sub)app.append(el("p",sub,"muted"));const nav=el("div",undefined,"top");nav.append(btn("Dashboard",home,true),btn("Learning Academy",academy,true),btn("Flashcards",()=>flash(),true),btn("Math Lab",mathLab,true),btn("ASP Archive",()=>location.href="asp/",true));app.append(nav);window.scrollTo(0,0)}function stats(d){const h=state.history.filter(x=>x.d===d);return h.length?Math.round(h.filter(x=>x.ok).length/h.length*100)+"% across "+h.length+" attempts":"Not assessed"}function priority(d){const h=state.history.filter(x=>x.d===d);const p=h.length?h.filter(x=>!x.ok).length/h.length:0.55;return p+(h.length<4?.25:0)}function ranked(){return DB.domains.map((_,i)=>i).sort((a,b)=>priority(b)-priority(a))}function home(){reset("CSP MASTER","A complete learning and practice companion • Study at your pace");let c=box("Your next study session");c.append(el("p","Choose the time you have. Your session emphasizes weak areas, learning and practice."));[30,60,120].forEach(m=>c.append(btn(m+" minutes",()=>session(m))));c=box("Readiness dashboard");c.append(el("p",state.history.length+" answered questions • "+Object.keys(state.completed).length+" lessons marked studied • "+Object.values(state.cards).filter(x=>x===2).length+" mastered flashcards"));const attempts=state.history.length;const pct=attempts?Math.round(state.history.filter(x=>x.ok).length/attempts*100):0;c.append(el("p","Practice accuracy: "+(attempts?pct+"%":"Not assessed")));c.append(el("p","This is a practice trend, not a prediction of the CSP exam result.","muted"));const weak=ranked().slice(0,3);c.append(el("p","Priority subjects: "+weak.map(i=>DB.domains[i][0]).join(" • ")));c=box("Start here");c.append(btn("40-question diagnostic",()=>start("Diagnostic",pickBalanced(40),0)));c.append(btn("Learning Academy",academy,true));c.append(btn("Practice weak areas",()=>start("Targeted practice",pickWeak(25),0),true));c=box("Challenge exams");c.append(el("p","Original independent practice questions. Calculation variants and some concepts recur. These are not official BCSP items.","muted"));[["Quick challenge",25,35],["Advanced challenge",75,100],["Timed mock",100,150],["Full question bank",DB.questions.length,240]].forEach(x=>c.append(btn(x[0]+" • "+x[1]+" questions",()=>start(x[0],shuffle(DB.questions).slice(0,x[1]),x[2]),true)));c=box("Study resources and backup");c.append(btn("Math Lab",mathLab),btn("Flashcards",()=>flash(),true),btn("Export CSP progress",exportData,true));c.append(el("p","ASP Master is safely archived at the same site. Its prior browser progress uses its original storage key and remains separate from CSP progress.","muted"));c.append(btn("Open ASP Archive",()=>location.href="asp/",true));app.append(el("footer","Study companion only. Verify current exam domains and requirements with BCSP; question scores do not guarantee passing."))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function pickBalanced(n){let arr=[];for(let i=0;i<10;i++)arr.push(...shuffle(DB.questions.filter(q=>q.d===i)).slice(0,Math.ceil(n/10)));return shuffle(arr).slice(0,n)}function pickWeak(n){const order=ranked();let arr=[];order.forEach((d,i)=>{const take=i<3?Math.ceil(n/5):2;arr.push(...shuffle(DB.questions.filter(q=>q.d===d)).slice(0,take))});return shuffle(arr).slice(0,n)}function session(minutes){const d=ranked()[0];reset(minutes+"-minute session","Focus: "+DB.domains[d][0]);let c=box("Your guided plan");c.append(el("p",minutes===30?"10 min lesson • 15 min practice • 5 min flashcards":minutes===60?"20 min lessons • 25 min practice • 15 min review":"35 min lessons • 60 min timed practice • 25 min review"));c.append(btn("Read priority lesson",()=>lesson(d)));c.append(btn("Begin targeted practice",()=>start("Study session",pickWeak(minutes===30?12:minutes===60?25:50),minutes===120?70:0),true));c.append(btn("Review flashcards",()=>flash(d),true))}function academy(){reset("Learning Academy","Open any subject to study the lesson, example and targeted questions.");const c=box("CSP study domains");DB.domains.forEach((d,i)=>{const det=el("details");const s=el("summary",d[0]+" • "+stats(i));det.append(s,el("p",d[1],"muted"),el("p",d[2]));det.append(btn("Open lesson",()=>lesson(i)),btn("Practice",()=>start(d[0]+" practice",shuffle(DB.questions.filter(q=>q.d===i)).slice(0,20),0),true),btn("Flashcards",()=>flash(i),true));c.append(det)})}function lesson(i){const d=DB.domains[i];reset(d[0],"Learning Academy • "+stats(i));let c=box("What you need to know");c.append(el("p",d[2]),el("p",d[3],"note"));c=box("Worked example / decision walkthrough");c.append(el("p",d[4]));c=box("Further reading");c.append(el("p",d[5]));c.append(el("p","Suggested search topics, not verified Kindle chapter numbers. Use current official standards and the BCSP CSP exam blueprint.","muted"));c=box("Check your understanding");c.append(btn("Practice 15 questions",()=>start(d[0]+" practice",shuffle(DB.questions.filter(q=>q.d===i)).slice(0,15),0)));c.append(btn("Mark lesson studied",()=>{state.completed[i]=Date.now();save();lesson(i)},true));if(state.completed[i])c.append(el("p","Lesson marked studied","good"))}function start(name,pool,minutes){quiz={name,pool:shuffle(pool),idx:0,correct:0,deadline:minutes?Date.now()+minutes*60000:0,answered:false};renderQuestion()}function renderQuestion(){if(!quiz)return home();if(quiz.idx>=quiz.pool.length||quiz.deadline&&Date.now()>quiz.deadline)return finish();const q=quiz.pool[quiz.idx];reset(quiz.name+" • "+(quiz.idx+1)+" / "+quiz.pool.length,DB.domains[q.d][0]);const c=box(q.q);if(quiz.deadline)c.append(el("p","Time remaining: "+Math.max(0,Math.ceil((quiz.deadline-Date.now())/60000))+" min","muted"));const choices=shuffle(q.options.map((v,i)=>({v,i})));choices.forEach(x=>{const b=btn(x.v,()=>answer(q,x.i,c),true);b.classList.add("choice");c.append(b)});c.append(btn("Exit to dashboard",home,true))}function answer(q,i,c){if(quiz.answered)return;quiz.answered=true;const ok=i===q.a;quiz.correct+=ok?1:0;state.history.push({id:q.id,d:q.d,ok,at:Date.now()});if(!ok)state.misses[q.id]=(state.misses[q.id]||0)+1;save();c.querySelectorAll("button").forEach(b=>b.disabled=true);c.append(el("h3",ok?"Correct":"Review this answer",ok?"good":"bad"));c.append(el("p","Correct answer: "+q.options[q.a]));c.append(el("p",q.why,"note"));c.append(btn("Next question",()=>{quiz.idx++;quiz.answered=false;renderQuestion()}))}function finish(){const q=quiz;quiz=null;reset(q.name+" complete","Results and next steps");let c=box("Your result");c.append(el("h2",q.correct+" / "+q.pool.length+" correct"));c.append(el("p","Your overall practice trend updates on the dashboard. Focus on missed concepts and repeat a new question set."));c.append(btn("Review priority lessons",academy),btn("Dashboard",home,true))}function flash(domain){const list=shuffle(DB.cards.filter(x=>domain===undefined||x.d===domain).sort((a,b)=>(state.cards[a.id]||0)-(state.cards[b.id]||0)));let i=0,revealed=false;function show(){if(i>=list.length){reset("Flashcards complete","Great work. Review missed cards again later.");return}const q=list[i];reset("Flashcards • "+(i+1)+" / "+list.length,DB.domains[q.d][0]);let c=box(q.front);if(revealed){c.append(el("p",q.back,"note"));c.append(btn("Needs review",()=>{state.cards[q.id]=1;save();i++;revealed=false;show()},true));c.append(btn("Got it",()=>{state.cards[q.id]=2;save();i++;revealed=false;show()}))}else c.append(btn("Reveal answer",()=>{revealed=true;show()}));c.append(btn("Dashboard",home,true))}show()}function mathLab(){reset("Advanced Math Lab","Write units, identify the correct formula, and verify the result.");const items=[["Incident rate","Cases × 200,000 / hours worked","6 cases and 600,000 hours: 6×200,000/600,000=2.0"],["Time-weighted average","Σ(concentration × hours) / total hours","2 h at 80 ppm and 6 h at 20 ppm: (160+120)/8=35 ppm"],["Ohm's law","I = V / R","240 V / 60 Ω = 4 A"],["Probability","P(A and B)=P(A)×P(B), only if independent","0.2×0.3=0.06, or 6%"],["Mean","Sum of observations / count","4, 8, 12 gives mean 8"],["Unit conversion","Convert all terms before substituting","2.5 hours × 60 = 150 minutes"]];const c=box("Formula reference and worked examples");items.forEach(x=>{const d=el("details");d.append(el("summary",x[0]),el("p",x[1],"note"),el("p",x[2]));c.append(d)});c.append(btn("Practice calculations",()=>start("Math challenge",shuffle(DB.questions.filter(x=>[2,3,9].includes(x.d))).slice(0,35),45)))}function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({exported:new Date().toISOString(),state},null,2)],{type:"application/json"}));a.download="csp-master-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}home();</script></body></html>
