const LESSONS=[
["Math & Metrics","Work through the units first. Convert all time intervals to the same unit before calculating. The recordable incident rate uses a 200,000-hour normalization factor.","TWA = sum of (concentration × hours) / total hours. Incident rate = cases × 200,000 / hours worked. Ohm's law: current = voltage / resistance.","Example: 3 recordables in 300,000 hours gives 3 × 200,000 / 300,000 = 2.0. For 60 ppm during 2h and 20 ppm during 6h, TWA = (120 + 120)/8 = 30 ppm.","5 Math Review; 15 Statistics; 17 Mechanics; 18 Hydrostatics and Hydraulics; 20 Engineering Economics; Appendices A and B"],
["Safety Management","Start with hazard identification, then assess likelihood and severity, then select controls. Use elimination and substitution before relying on procedures or PPE. A leading indicator measures prevention activity; a lagging indicator measures an outcome.","Risk screening often combines likelihood × severity. FMEA examines failure modes and effects. Fault tree analysis works backward from an undesired event. Management of change reviews new risks before implementation.","Example: Replacing a toxic solvent with a less hazardous one is substitution; requiring gloves for the original solvent is PPE. The first generally reduces reliance on worker behavior.","4 Regulations; 14 PPE; 16 Electrical Safety; 22 Accident Investigation; 25 Construction Safety; 26 Risk Assessment; 31 Safety Management Systems; 35 Prevention through Design; 36 Performance; 38 Management of Change"],
["Ergonomics","Watch for force, repetition, awkward posture, contact stress and duration. Reduce reach distance, use adjustable workstations and mechanical assists, and check whether a task redesign actually lowers exposure.","The NIOSH lifting equation estimates a recommended weight limit for certain two-handed lifts. RULA screens upper-limb posture; anthropometry provides human body measurements for design.","Example: Moving frequently used tools from an overhead shelf to waist height reduces elevated-arm reaching. Rotating workers without changing high-force tasks may only redistribute exposure.","24 Ergonomics; 30 Materials Handling and Storage"],
["Fire Protection","Fire requires fuel, oxygen, heat and a sustaining chemical chain reaction. Recognize the fire classes and select extinguishing methods for the fuel and conditions. Control ignition during hot work and flammable-liquid transfer.","Class A: ordinary combustibles; B: flammable liquids; C: energized electrical equipment; D: combustible metals; K: cooking oils and fats. Combustible dust can explode when dispersed with ignition and confinement.","Example: A fire involving energized electrical equipment is Class C until de-energized. An extinguisher must be suitable for the actual materials involved.","12 Fire Protection and Prevention; 16 Electrical Safety; 27 Hazardous Materials"],
["Emergency Preparedness","An emergency action plan should identify reporting, alarms, evacuation routes, accountability and assigned roles. Exercises test whether people can follow the plan under realistic constraints.","ICS organizes incident command and resources. Tabletop exercises are discussion-based; functional and full-scale exercises test more operational elements. Business continuity addresses critical operations after disruption.","Example: During a drill, discovering that one assembly point is blocked should trigger a plan revision and retraining rather than simply recording a drill completion.","32 Site Security; 39 Emergency Preparedness and Response"],
["Industrial Hygiene","Anticipate, recognize, evaluate and control exposures. Consider inhalation, absorption, ingestion and injection. Identify the agent, its toxicity, exposure duration and route before choosing controls.","TWA = sum of concentration × time / total time. STEL is a short-term exposure limit; a ceiling is not to be exceeded. Personal sampling assesses breathing-zone exposure. Point-source radiation intensity follows approximately 1/distance squared.","Example: At 80 ppm for 2 hours and 20 ppm for 6 hours, the 8-hour TWA is (160 + 120)/8 = 35 ppm. Whether it complies depends on the substance and applicable limit.","6 Particulates and Gases; 7 Toxicology; 8 Industrial Hygiene Air Sampling; 9 Ventilation; 10 Noise; 11 Biological Hazards; 13 Thermal Stressors; 28 Radiation Safety"],
["Environmental","Prefer pollution prevention before end-of-pipe controls. Plan for spills, waste segregation, regulatory obligations, and impacts to air, water and soil. Consider the full lifecycle of materials.","The waste hierarchy favors source reduction before reuse, recycling, treatment and disposal. ISO 14001 is an environmental management system framework.","Example: Redesigning a process to use less hazardous material prevents waste at the source; collecting and disposing of the original waste only manages it afterward.","27 Hazardous Materials Management; 33 Sustainability; 34 Environmental Management"],
["Training","Effective safety training begins with the task, learner needs and expected performance. Confirm competence through demonstration rather than attendance alone. Refresh instruction when work or hazards change.","Training needs analysis compares required versus current competency. Use clear objectives, practice, feedback and checks for transfer to real work.","Example: After lockout training, ask a worker to demonstrate isolation and verification on the actual equipment or a safe simulation, then correct observed gaps.","19 Training; 21 Management Theories; 31 Safety Management Systems"],

function studyCenter(){header("Study Center","Lessons • worked examples • Kindle reading • self-check");LESSONS.forEach(l=>{let c=el("section",undefined,"card");c.append(el("h2",l[0]),el("p",l[1]),el("p","Remember: "+l[2],"note"),el("p","Worked example: "+l[3]),el("p","Find it in Yates 4th edition: "+l[4],"muted"));c.append(button("Practice this lesson",()=>start(l[0],DATA.map((q,i)=>q[0]===l[0]?i:-1).filter(i=>i>=0).sort(()=>Math.random()-.5).slice(0,12)),true));app.append(c)});app.append(button("Back to dashboard",home))}
function flashcardDeck(){header("Study Flashcards","Choose a subject, reveal each answer, then rate your recall.");let select=el("section",undefined,"card");DOMAINS.forEach(d=>select.append(button(d[0],()=>deck(d[0]),true)));select.append(button("All subjects",()=>deck(null)));app.append(select)}
function deck(topic){let cards=DATA.map((q,i)=>({q,i})).filter(x=>!topic||x.q[0]===topic).sort(()=>Math.random()-.5);let pos=0,revealed=false,known=0,again=[];function render(){header("Flashcards • "+(topic||"All subjects"),(pos+1)+" of "+cards.length+" • "+known+" marked known");if(pos>=cards.length){app.append(el("h2","Deck complete"),el("p",known+" of "+cards.length+" marked known"));if(again.length)app.append(button("Retry difficult cards",()=>{cards=again.map(i=>({q:DATA[i],i}));again=[];pos=0;known=0;revealed=false;render()}));app.append(button("Study Center",studyCenter,true),button("Dashboard",home,true));return}let x=cards[pos],c=el("section",undefined,"card");c.append(el("h2",x.q[1]));if(revealed)c.append(el("p",x.q[2],"good"),el("p",x.q[4],"note"),el("p","Kindle: "+(CHAPTERS[x.q[0]]||BOOK[x.q[0]]||"Search this topic"),"muted"));app.append(c);if(!revealed)app.append(button("Reveal answer",()=>{revealed=true;render()}));else{app.append(button("I knew it",()=>{known++;pos++;revealed=false;render()}),button("Study again",()=>{again.push(x.i);pos++;revealed=false;render()},true))}app.append(button("Exit deck",flashcardDeck,true))}render()}
const finalHome=home;home=function(){finalHome();let c=el("section",undefined,"card");c.append(el("h2","Study Center"),el("p","Actual lessons, worked examples, Kindle chapter references, and flashcards that track which cards need another review."));c.append(button("Open Study Center",studyCenter),button("Flashcard decks",flashcardDeck,true));app.append(c)};home();
